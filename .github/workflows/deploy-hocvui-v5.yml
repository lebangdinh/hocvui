name: Verify and deploy Học Vui V5

on:
  push:
    branches: [main, v5-deploy-review, southern-female-yen-nhi-20261008]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hocvui-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify isolated Firebase project
        env:
          HOC_VUI_STAGING_PROJECT_ID: hoc-vui-tieu-hoc-2026
        run: npm run check:deploy
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test content and mocked permissions
        run: npm run test:offline
      - name: Type-check
        run: npm run lint
      - name: Verify games and Vietnamese audio safety
        run: node scripts/test-games-and-sound.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline Vietnamese speech synthesizer
        run: |
          python -m pip install --disable-pip-version-check "piper-tts==1.8.0" "imageio-ffmpeg==0.6.0"
          python -c "from imageio_ffmpeg import get_ffmpeg_exe; print('FFmpeg:', get_ffmpeg_exe())"
      - name: Download verified southern Vietnamese female voice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/piper-vietnamese
          prefix="https://huggingface.co/CakeByVPBank/piper-pgl-v4-vi_VN-version39_epoch39/resolve/main"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 --max-time 240 "$prefix/vi_VN-csa-voice-piper-v3-medium.onnx?download=true" -o .cache/piper-vietnamese/vi_VN-csa-voice-piper-v3-medium.onnx
          echo "99424831c88afec929eba3aef83a1b3d92f261b0bdc771bc2458f7f1ba63b6d2  .cache/piper-vietnamese/vi_VN-csa-voice-piper-v3-medium.onnx" | sha256sum -c -
          curl --fail --location --silent --show-error --retry 4 --max-time 120 "$prefix/vi_VN-csa-voice-piper-v3-medium.onnx.json" -o .cache/piper-vietnamese/vi_VN-csa-voice-piper-v3-medium.onnx.json
          python -m json.tool .cache/piper-vietnamese/vi_VN-csa-voice-piper-v3-medium.onnx.json > /dev/null
      - name: Generate eight southern female Yến Nhi praise clips
        run: python scripts/generate-piper-voice.py
      - name: Assert all downloadable voice assets exist
        shell: bash
        run: |
          set -euo pipefail
          for n in {01..08}; do test -s "public/audio/vi-south/praise-$n.mp3"; done
          test -s public/audio/vi-south/ATTRIBUTION.txt
      - name: Build website at /hocvui/
        env:
          VITE_BASE_PATH: /hocvui/
          VITE_USE_FIREBASE_EMULATORS: 'false'
          VITE_SOUTHERN_VOICE_READY: 'true'
        run: |
          npm run build
          test -s dist/index.html
          for n in {01..08}; do test -s "dist/audio/vi-south/praise-$n.mp3"; done
          if grep -REn 'GEMINI_API_KEY|sk-[a-zA-Z0-9]{12,}' dist/assets; then
            echo 'Found possible secret in static bundle'; exit 1
          fi
      - name: Upload compiled site for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Smoke-test public URL and JavaScript bundle
        shell: bash
        run: |
          set -euo pipefail
          site="https://lebangdinh.github.io/hocvui/"
          for attempt in {1..12}; do
            html="$(curl -fsSL --connect-timeout 10 --max-time 25 "$site" || true)"
            js="$(printf '%s' "$html" | grep -oE '/hocvui/assets/[^"]+\.js' | head -n1 || true)"
            if [[ -n "$js" ]] && curl -fsSL --connect-timeout 10 --max-time 35 -o /dev/null "https://lebangdinh.github.io$js" && curl -fsSL --connect-timeout 10 --max-time 35 -o /dev/null "${site}audio/vi-south/praise-01.mp3" && curl -fsSL --connect-timeout 10 --max-time 35 -o /dev/null "${site}audio/vi-south/praise-08.mp3"; then
              echo "PASS: Học Vui V5, JavaScript and southern Vietnamese MP3s reachable at $site"
              exit 0
            fi
            echo "Waiting for GitHub Pages CDN, attempt $attempt/12"
            sleep 5
          done
          echo "FAIL: Built Học Vui V5 not yet visible at public URL"
          exit 1

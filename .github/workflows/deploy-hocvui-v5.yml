name: Verify and deploy Học Vui V5

on:
  push:
    branches: [main, v5-deploy-review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hocvui-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify isolated Firebase project
        env:
          HOC_VUI_STAGING_PROJECT_ID: hoc-vui-tieu-hoc-2026
        run: npm run check:deploy
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test content and mocked permissions
        run: npm run test:offline
      - name: Type-check
        run: npm run lint
      - name: Build website at /hocvui/
        env:
          VITE_BASE_PATH: /hocvui/
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: |
          npm run build
          test -s dist/index.html
          if grep -REn 'GEMINI_API_KEY|sk-[a-zA-Z0-9]{12,}' dist/assets; then
            echo 'Found possible secret in static bundle'; exit 1
          fi
      - name: Upload compiled site for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
